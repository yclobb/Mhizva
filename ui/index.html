<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Mhizva</title><link rel="stylesheet" href="/app.css"><script src="/i18n.js" defer></script><script src="/results.js" defer></script><script src="/app.js" defer></script></head>
<body>
<aside class="library" data-i18n-aria="libraryAria">
<a class="brand" href="/" data-i18n-aria="home"><span class="brand-mark">m<span>·</span></span>Mhizva</a>
<div class="library-heading"><h2 data-i18n="library">Documents</h2><span id="doc-count">—</span></div>
<div id="tree" class="tree" data-i18n-aria="treeAria"><p class="muted" data-i18n="openingLibrary">Opening your library…</p></div>
<div id="drop-zone" class="drop-zone"><input id="files" type="file" multiple class="visually-hidden"><label for="files" class="upload-label"><span aria-hidden="true">＋</span> <span data-i18n="addDocuments">Add files</span></label><p data-i18n="dropHere">or drop them here</p></div>
<div id="upload-status" role="status" aria-live="polite"></div>
<div class="privacy"><span aria-hidden="true">◈</span> <span data-i18n="privacy">Stored on this computer</span></div>
</aside>
<main class="workspace">
<header class="topbar"><span class="workspace-name" data-i18n="tagline">Workspace</span><div class="topbar-actions"><label for="language" class="visually-hidden" data-i18n="language">App language</label><select id="language" data-i18n-aria="language"><option value="en" lang="en">English</option><option value="zh" lang="zh-CN">中文</option></select><span id="model-status" class="model-status" role="status"><i></i> Connecting…</span></div></header>
<nav class="mode-bar" data-i18n-aria="modeLabel"><span class="mode-label" data-i18n="modeLabel">Mode</span><div id="mode-controls" class="mode-controls"><button type="button" data-mode="general" aria-pressed="true"><span class="mode-letter" aria-hidden="true">G</span><span data-i18n="modeGeneral">General</span></button><button type="button" data-mode="data" aria-pressed="false"><span class="mode-letter" aria-hidden="true">D</span><span data-i18n="modeData">Data</span></button><button type="button" data-mode="business" aria-pressed="false"><span class="mode-letter" aria-hidden="true">B</span><span data-i18n="modeBusiness">Business</span></button></div><p id="mode-note" class="mode-note"></p></nav>
<div id="demo-notice" class="demo-notice" data-i18n="demo" role="status" hidden>Stand-in demo · lookups use keyword matching</div>
<section id="conversation" class="conversation" data-i18n-aria="conversation" aria-busy="false">
<div id="welcome" class="welcome"><h1 id="welcome-title">General</h1><p id="welcome-description"></p><div class="welcome-note"><span id="welcome-hint"></span></div></div>
<div id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
</section>
<div class="compose-area"><form id="ask-form" class="composer"><label for="question" class="visually-hidden" data-i18n="questionLabel">Ask about your documents</label><textarea id="question" data-i18n-placeholder="questionPlaceholder" placeholder="Ask about your documents…" rows="1" maxlength="12000"></textarea><button id="send" type="submit" data-i18n-aria="send" disabled>↑</button></form><p class="compose-note" id="compose-note" data-i18n="sourceReminder">Answers grounded in your library. Always check the source.</p></div>
</main>
<dialog id="document-dialog" aria-labelledby="document-title"><div class="document-heading"><div><p id="document-path" class="eyebrow"></p><h2 id="document-title">Document</h2></div><button id="close-document" class="close-button" data-i18n-aria="closeDocument">×</button></div><p id="passage-note" role="status" data-i18n="missingPassage" hidden></p><article id="document-body" class="document-body"></article></dialog>
</body></html>
